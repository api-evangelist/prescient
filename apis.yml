aid: prescient
name: Prescient
description: >-
  Prescient Co. Inc. was a United States construction-technology and manufacturing company
  that sold an integrated design, engineering, manufacturing and assembly platform for
  multi-unit buildings — apartments, condominiums, student and military dormitories, hotels
  and senior-living communities. Its product was the patented Prescient Solution built on the
  Unified Truss Construction System (UTCS), a light-gauge steel structural framing system
  manufactured off-site in panelised components and assembled on-site, marketed as a faster,
  greener and lower-cost alternative to conventional cast-in-place and wood-frame structures
  at heights up to roughly twelve stories. The "technology" in the offering was internal
  design-automation software that linked architectural design, structural engineering,
  factory manufacturing and field assembly into one digital model; it was delivered as a
  design-build service to real-estate developers and general contractors, never as a product
  a third party could integrate with. Founded in 2012 (some sources list 2013) and
  headquartered in North Carolina — Charlotte, later Durham — with manufacturing in Mebane,
  North Carolina and Arvada, Colorado, the company raised a large private round stack
  including a $40M Series D and a Series E led by Eldridge Industries at a reported $650M
  valuation; publicly reported lifetime totals disagree, with EquityZen listing $103M and
  Crunchbase reporting roughly $375M through Series G. The company contracted sharply: the
  Mebane plant closed in 2022 with 83 jobs cut, 50 Arvada jobs were cut in April 2023, and a
  Colorado WARN notice filed on 31 August 2023 announced the permanent closure of the Arvada
  plant and a further 60 jobs, stating that upon conclusion of the shutdown activities the
  company would be closed. Prescient never operated a public developer program, API, SDK,
  webhook surface or machine-readable specification, and prescientco.com has since passed out
  of the company's control. This profile is retained as a historical record; there is no API
  surface to enrich.
