x-domain-note: >-
  prescientco.com was the company's website while it operated and is no longer controlled by
  Prescient. The apex now 301s to https://www.mellonaid.com/, an unrelated site, and the TLS
  certificate served on the host is issued to CN=mellonaid.com (SANs mellonaid.com,
  www.mellonaid.com only), so HTTPS to prescientco.com fails hostname verification. Every
  other path returns that site's ~40.5KB HTML 404, identical in shape for a control path
  that cannot exist. It is NOT the Prescient company site and is deliberately not wired as a
  Website pointer. See well-known/prescient-well-known.yml for the full probe.
